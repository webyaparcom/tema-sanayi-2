<header class="modulex-ust-kuyruk{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-ust-kuyruk-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</header>

<style>
  /* ust-kuyruk — Menü yalnız «nereye gidebilirim» değil «neredeyim» de der: etkin sayfadan türeyen gezinti izi (breadcrumb, aria-current) başlığın parçası — derin sayfalı sitelerde konum hissi. */
  .modulex-ust-kuyruk { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-kuyruk *, .modulex-ust-kuyruk *::before, .modulex-ust-kuyruk *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-kuyruk :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-kuyruk :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-kuyruk :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-kuyruk :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-kuyruk img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-kuyruk) img { height: auto; }
  .modulex-ust-kuyruk [hidden] { display: none !important; }
  .modulex-ust-kuyruk :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-kuyruk :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-kuyruk-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-kuyruk-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-kuyruk--bassiz .modulex-ust-kuyruk-bas { display: none; }
  .modulex-ust-kuyruk-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ust-kuyruk-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ust-kuyruk-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-kuyruk-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-kuyruk-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-kuyruk-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-kuyruk-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-kuyruk-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ust-kuyruk-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ust-kuyruk { position: relative; z-index: 900; }
  .modulex-ust-kuyruk-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-kuyruk-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-kuyruk-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-kuyruk-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-kuyruk-oge:hover, .modulex-ust-kuyruk-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-kuyruk-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-kuyruk-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-kuyruk-cta .material-symbols-outlined, .modulex-ust-kuyruk-tel .material-symbols-outlined, .modulex-ust-kuyruk-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-kuyruk-tel, .modulex-ust-kuyruk-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-kuyruk-tel:hover, .modulex-ust-kuyruk-posta:hover { color: --accentInk--; }
  .modulex-ust-kuyruk-dil:empty { display: none; }
  .modulex-ust-kuyruk-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-kuyruk-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-kuyruk-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-kuyruk--acik .modulex-ust-kuyruk-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-kuyruk--acik .modulex-ust-kuyruk-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-kuyruk--acik .modulex-ust-kuyruk-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-kuyruk-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-kuyruk-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-kuyruk-sol 0.3s ease both; }
  @keyframes modulex-ust-kuyruk-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-kuyruk-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-kuyruk--js .modulex-ust-kuyruk-nav, .modulex-ust-kuyruk--js .modulex-ust-kuyruk-genis { display: none; }
    .modulex-ust-kuyruk--js .modulex-ust-kuyruk-ac { display: inline-flex; }
    .modulex-ust-kuyruk-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-kuyruk-in 0.3s ease both; }
    .modulex-ust-kuyruk-pliste { display: grid; }
    .modulex-ust-kuyruk-pliste .modulex-ust-kuyruk-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-kuyruk-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-kuyruk-panel { display: none !important; }
  }
  @keyframes modulex-ust-kuyruk-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-kuyruk-sira { display: flex; align-items: center; gap: 12px 28px; padding-block: 14px; }
  .modulex-ust-kuyruk-sira > .modulex-ust-kuyruk-logo { margin-inline-end: auto; }
  .modulex-ust-kuyruk-kliste { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .modulex-ust-kuyruk-koge { display: inline-flex; align-items: center; min-height: 42px; padding-inline: 12px; border-radius: 8px; color: inherit; font-weight: 600; text-decoration: none; transition: background-color 0.2s ease, color 0.2s ease; }
  .modulex-ust-kuyruk-koge:hover { background-color: color-mix(in srgb, --accent-- 10%, transparent); color: --accentInk--; }
  .modulex-ust-kuyruk-koge[aria-current="page"] { color: --accentInk--; text-decoration: underline 2px; text-underline-offset: 6px; }
  .modulex-ust-kuyruk-genis { display: flex; align-items: center; gap: 12px; }
  .modulex-ust-kuyruk-izband { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 18px; margin-block-end: 10px; padding-block: 6px; padding-inline: 12px 8px; border-radius: 12px; background-color: --kartBg--; font-size: 0.9rem; }
  .modulex-ust-kuyruk-izliste { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; }
  .modulex-ust-kuyruk-halka { display: inline-flex; align-items: center; }
  .modulex-ust-kuyruk-halka + .modulex-ust-kuyruk-halka::before { content: ""; width: 7px; height: 7px; margin-inline: 10px 12px; border-block-start: 1.5px solid --muted--; border-inline-end: 1.5px solid --muted--; transform: rotate(45deg); }
  [dir="rtl"] .modulex-ust-kuyruk-halka + .modulex-ust-kuyruk-halka::before { transform: rotate(-45deg); }
  .modulex-ust-kuyruk-izoge, .modulex-ust-kuyruk-burada { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; color: --muted--; text-decoration: none; }
  .modulex-ust-kuyruk-izoge { transition: color 0.2s ease; }
  .modulex-ust-kuyruk-izoge:hover { color: --accentInk--; text-decoration: underline; }
  .modulex-ust-kuyruk-burada { padding-inline: 12px; border-radius: 999px; background-color: --bg--; box-shadow: inset 0 0 0 1px --cizgi--; color: --text--; font-weight: 700; animation: modulex-ust-kuyruk-iz 0.4s ease both; }
  .modulex-ust-kuyruk-halka .material-symbols-outlined, .modulex-ust-kuyruk-iztel .material-symbols-outlined { font-size: 18px; }
  @keyframes modulex-ust-kuyruk-iz { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .modulex-ust-kuyruk-iztel { display: inline-flex; align-items: center; gap: 6px; color: inherit; font-weight: 700; text-decoration: none; white-space: nowrap; transition: color 0.2s ease; }
  .modulex-ust-kuyruk-iztel .material-symbols-outlined { color: --accentInk--; }
  .modulex-ust-kuyruk-iztel:hover { color: --accentInk--; }
  @media (max-width: 1024px) {
    .modulex-ust-kuyruk:not(.modulex-ust-kuyruk--js) .modulex-ust-kuyruk-sira { flex-wrap: wrap; }
  }
  @media (max-width: 768px) {
    .modulex-ust-kuyruk-izband { padding-inline: 10px 6px; font-size: 0.85rem; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kuyruk :is(.modulex-ust-kuyruk-baslik, .modulex-ust-kuyruk-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kuyruk-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-kuyruk { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-kuyruk *, .modulex-ust-kuyruk *::before, .modulex-ust-kuyruk *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-kuyruk";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
    });
  })();
</script>
