<style>
  /* zaman-buyume-egri — zaman-merdiven büyümeyi basamak yüksekliğiyle, zaman-ilerleme kaydırma çizgisiyle gösterir; zaman-buyume-egri veri görselleştirmesidir: gerçek değerlerle ölçeklenen eğri/alan grafiği, noktalara bağlı numaralı kartlar ve nokta↔kart vurgu eşlemesi — üretim/şube/ciro büyümesi. */
  .modulex-zaman-buyume-egri { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-zaman-buyume-egri *, .modulex-zaman-buyume-egri *::before, .modulex-zaman-buyume-egri *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-zaman-buyume-egri :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-zaman-buyume-egri :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-zaman-buyume-egri :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-zaman-buyume-egri :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-zaman-buyume-egri img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-zaman-buyume-egri) img { height: auto; }
  .modulex-zaman-buyume-egri [hidden] { display: none !important; }
  .modulex-zaman-buyume-egri :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-zaman-buyume-egri :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-zaman-buyume-egri-ic { max-width: --max--; margin-inline: auto; }
  .modulex-zaman-buyume-egri-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-zaman-buyume-egri--bassiz .modulex-zaman-buyume-egri-bas { display: none; }
  .modulex-zaman-buyume-egri-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-zaman-buyume-egri-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-zaman-buyume-egri-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-zaman-buyume-egri-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-zaman-buyume-egri-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-zaman-buyume-egri-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-zaman-buyume-egri-dugme:hover { transform: translateY(-2px); }
  .modulex-zaman-buyume-egri-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-zaman-buyume-egri-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-zaman-buyume-egri-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-zaman-buyume-egri-grafik { position: relative; height: clamp(240px, 30vw, 340px); margin-block-end: 26px; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background-color: --kartBg--; }
  .modulex-zaman-buyume-egri-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; clip-path: inset(-10px -10px -10px -10px); transition: clip-path 1.8s cubic-bezier(0.3, 0.7, 0.2, 1); }
  .modulex-zaman-buyume-egri--hazir:not(.modulex-zaman-buyume-egri--gor) .modulex-zaman-buyume-egri-svg { clip-path: inset(-10px 100% -10px -10px); }
  .modulex-zaman-buyume-egri-svg:dir(rtl) { transform: scaleX(-1); }
  .modulex-zaman-buyume-egri-izgara line { stroke: --cizgi--; stroke-width: 1; stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; }
  .modulex-zaman-buyume-egri-alan { fill: color-mix(in srgb, --accent-- 16%, transparent); transition: fill 0.4s ease; }
  .modulex-zaman-buyume-egri-grafik:hover .modulex-zaman-buyume-egri-alan { fill: color-mix(in srgb, --accent-- 24%, transparent); }
  .modulex-zaman-buyume-egri-hat { fill: none; stroke: --accent--; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .modulex-zaman-buyume-egri-nokta { position: absolute; inset-block-start: var(--y); inset-inline-start: var(--x); z-index: 1; width: 18px; height: 18px; margin: -9px; border: 4px solid --accent--; border-radius: 50%; background-color: --kartBg--; transition: transform 0.25s ease, background-color 0.25s ease; }
  .modulex-zaman-buyume-egri-nokta.modulex-zaman-buyume-egri--isik { background-color: --accent--; transform: scale(1.4); }
  .modulex-zaman-buyume-egri-netiket { position: absolute; inset-block-end: calc(100% + 8px); inset-inline-start: 50%; padding: 2px 8px; border-radius: 6px; background-color: --text--; color: --bg--; font-size: 0.78rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; translate: -50% 0; }
  .modulex-zaman-buyume-egri-netiket:dir(rtl) { translate: 50% 0; }
  .modulex-zaman-buyume-egri-kartlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; }
  .modulex-zaman-buyume-egri-kart { position: relative; display: grid; align-content: start; gap: 8px; padding: 20px; border: 1.5px solid --cizgi--; border-radius: --yuvarlak--; background-color: --kartBg--; transition: border-color 0.25s ease, transform 0.25s ease; }
  .modulex-zaman-buyume-egri-kart.modulex-zaman-buyume-egri--isik { border-color: --accent--; transform: translateY(-4px); }
  .modulex-zaman-buyume-egri-kust { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .modulex-zaman-buyume-egri-sira { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background-color: --accent--; color: --accentText--; font-size: 0.8rem; font-weight: 800; }
  .modulex-zaman-buyume-egri-kyil { color: --muted--; font-size: 0.88rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .modulex-zaman-buyume-egri-deger { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; color: --accentInk--; font-size: clamp(1.6rem, 2.6vw, 2.1rem); font-weight: 850; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .modulex-zaman-buyume-egri-birim { color: --muted--; font-size: 0.95rem; font-weight: 650; letter-spacing: 0; }
  .modulex-zaman-buyume-egri-kbaslik { font-size: 1.08rem; font-weight: 740; }
  .modulex-zaman-buyume-egri-kmetin { color: --muted--; font-size: 0.93rem; }
  @media (max-width: 768px) {
    .modulex-zaman-buyume-egri-grafik { height: 220px; }
    .modulex-zaman-buyume-egri-netiket { padding: 1px 6px; font-size: 0.7rem; }
  }
  .modulex-zaman-buyume-egri-bag { color: inherit; text-decoration: none; }
  .modulex-zaman-buyume-egri-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-zaman-buyume-egri-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-buyume-egri :is(.modulex-zaman-buyume-egri-baslik, .modulex-zaman-buyume-egri-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-buyume-egri-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-zaman-buyume-egri { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-zaman-buyume-egri *, .modulex-zaman-buyume-egri *::before, .modulex-zaman-buyume-egri *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-zaman-buyume-egri";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const egriEsle = (s, P) => {
        const E = [...s.querySelectorAll("[data-egri]")];
        if (!E.length) return;
        const isik = (n, a) => E.forEach((e) => { if (e.dataset.egri === n) e.classList.toggle(P + "--isik", a); });
        E.forEach((e) => {
          const n = e.dataset.egri;
          e.addEventListener("pointerenter", () => isik(n, true));
          e.addEventListener("pointerleave", () => isik(n, false));
          e.addEventListener("focusin", () => isik(n, true));
          e.addEventListener("focusout", () => isik(n, false));
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      egriEsle(s, P, az);
    });
  })();
</script>
